<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter for System Boundary & External Nodes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.10" />
    </filter>

    <!-- Arrow Markers for External Systems -->
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- ================= SYSTEM BOUNDARY RECTANGLE ================= -->
  <!-- The Only Enclosed Box in the Diagram -->
  <g filter="url(#shadow)">
    <rect x="290" y="30" width="660" height="860" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <!-- System Boundary Header Banner -->
    <rect x="290" y="30" width="660" height="38" rx="10" fill="#0f172a" />
    <rect x="290" y="56" width="660" height="12" fill="#0f172a" />
    <text x="620" y="55" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">EVATRACK PLATFORM</text>
  </g>

  <!-- ================= USE CASE OVALS (Inside System Boundary) ================= -->
  
  <!-- 1. UC_USERS -->
  <g transform="translate(620, 95)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Manage User Accounts</text>
  </g>

  <!-- 2. UC_EVENTS -->
  <g transform="translate(620, 165)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Manage Disaster Events</text>
  </g>

  <!-- 3. UC_CENTERS -->
  <g transform="translate(620, 235)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Manage Centers &amp; Assign Personnel</text>
  </g>

  <!-- 4. UC_ALERTS -->
  <g transform="translate(620, 305)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Broadcast Emergency Alerts (SMS &amp; Push)</text>
  </g>

  <!-- 5. UC_ANALYTICS -->
  <g transform="translate(620, 375)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">View &amp; Export Evacuation Analytics</text>
  </g>

  <!-- 6. UC_ISSUES -->
  <g transform="translate(620, 445)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Report &amp; Monitor Center Issues</text>
  </g>

  <!-- 7. UC_RESOURCES -->
  <g transform="translate(620, 515)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Request &amp; Track Logistics Assistance</text>
  </g>

  <!-- 8. UC_VERIFY -->
  <g transform="translate(620, 585)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Verify &amp; Admit Households (QR / Manual)</text>
  </g>

  <!-- 9. UC_UNITS -->
  <g transform="translate(620, 655)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Configure Units &amp; Allocate Families</text>
  </g>

  <!-- 10. UC_CHECKOUT -->
  <g transform="translate(620, 725)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Track Member Stay &amp; Process Checkout</text>
  </g>

  <!-- 11. UC_PORTAL -->
  <g transform="translate(620, 795)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">View Public Evacuation Map</text>
  </g>

  <!-- 12. UC_RCV_ALERTS -->
  <g transform="translate(620, 860)">
    <ellipse cx="0" cy="0" rx="170" ry="22" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <text x="0" y="5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Receive Emergency Alerts</text>
  </g>

  <!-- ================= STICK FIGURE ACTORS (Unenclosed / No Boxes) ================= -->

  <!-- ACTOR 1: SUPER ADMIN -->
  <g transform="translate(110, 55)">
    <!-- Head -->
    <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#9333ea" stroke-width="2.5" />
    <!-- Torso -->
    <line x1="0" y1="13" x2="0" y2="44" stroke="#9333ea" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#9333ea" stroke-width="2.5" />
    <!-- Left Leg -->
    <line x1="0" y1="44" x2="-14" y2="70" stroke="#9333ea" stroke-width="2.5" />
    <!-- Right Leg -->
    <line x1="0" y1="44" x2="14" y2="70" stroke="#9333ea" stroke-width="2.5" />
    <!-- Label -->
    <text x="0" y="92" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">Super Admin</text>
  </g>

  <!-- ACTOR 2: EVACUATION ADMIN -->
  <g transform="translate(110, 260)">
    <!-- Head -->
    <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <!-- Torso -->
    <line x1="0" y1="13" x2="0" y2="44" stroke="#2563eb" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#2563eb" stroke-width="2.5" />
    <!-- Left Leg -->
    <line x1="0" y1="44" x2="-14" y2="70" stroke="#2563eb" stroke-width="2.5" />
    <!-- Right Leg -->
    <line x1="0" y1="44" x2="14" y2="70" stroke="#2563eb" stroke-width="2.5" />
    <!-- Label -->
    <text x="0" y="92" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">Evacuation Admin</text>
  </g>

  <!-- ACTOR 3: EVACUATION PERSONNEL -->
  <g transform="translate(110, 530)">
    <!-- Head -->
    <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#059669" stroke-width="2.5" />
    <!-- Torso -->
    <line x1="0" y1="13" x2="0" y2="44" stroke="#059669" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#059669" stroke-width="2.5" />
    <!-- Left Leg -->
    <line x1="0" y1="44" x2="-14" y2="70" stroke="#059669" stroke-width="2.5" />
    <!-- Right Leg -->
    <line x1="0" y1="44" x2="14" y2="70" stroke="#059669" stroke-width="2.5" />
    <!-- Label -->
    <text x="0" y="92" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">Evacuation Personnel</text>
  </g>

  <!-- ACTOR 4: RESIDENT / HOUSEHOLD -->
  <g transform="translate(110, 760)">
    <!-- Head -->
    <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#0891b2" stroke-width="2.5" />
    <!-- Torso -->
    <line x1="0" y1="13" x2="0" y2="44" stroke="#0891b2" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#0891b2" stroke-width="2.5" />
    <!-- Left Leg -->
    <line x1="0" y1="44" x2="-14" y2="70" stroke="#0891b2" stroke-width="2.5" />
    <!-- Right Leg -->
    <line x1="0" y1="44" x2="14" y2="70" stroke="#0891b2" stroke-width="2.5" />
    <!-- Label -->
    <text x="0" y="92" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">Resident / Household</text>
  </g>

  <!-- ================= SOLID ASSOCIATION LINES (No Arrowheads) ================= -->

  <!-- 1. Super Admin Associations (Purple) -->
  <line x1="140" y1="95" x2="450" y2="95" stroke="#9333ea" stroke-width="2.5" />

  <!-- 2. Evacuation Admin Associations (Blue) -->
  <line x1="140" y1="300" x2="450" y2="165" stroke="#2563eb" stroke-width="2.5" />
  <line x1="140" y1="300" x2="450" y2="235" stroke="#2563eb" stroke-width="2.5" />
  <line x1="140" y1="300" x2="450" y2="305" stroke="#2563eb" stroke-width="2.5" />
  <line x1="140" y1="300" x2="450" y2="375" stroke="#2563eb" stroke-width="2.5" />
  <line x1="140" y1="300" x2="450" y2="445" stroke="#2563eb" stroke-width="2.5" />
  <line x1="140" y1="300" x2="450" y2="515" stroke="#2563eb" stroke-width="2.5" />

  <!-- 3. Evacuation Personnel Associations (Green) -->
  <line x1="140" y1="570" x2="450" y2="445" stroke="#059669" stroke-width="2.5" />
  <line x1="140" y1="570" x2="450" y2="515" stroke="#059669" stroke-width="2.5" />
  <line x1="140" y1="570" x2="450" y2="585" stroke="#059669" stroke-width="2.5" />
  <line x1="140" y1="570" x2="450" y2="655" stroke="#059669" stroke-width="2.5" />
  <line x1="140" y1="570" x2="450" y2="725" stroke="#059669" stroke-width="2.5" />

  <!-- 4. Resident / Household Associations (Teal) -->
  <line x1="140" y1="800" x2="450" y2="795" stroke="#0891b2" stroke-width="2.5" />
  <line x1="140" y1="800" x2="450" y2="860" stroke="#0891b2" stroke-width="2.5" />

  <!-- ================= EXTERNAL SYSTEMS (Right Column) ================= -->
  
  <!-- SafeTrack System -->
  <g transform="translate(1010, 555)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
    <text x="110" y="24" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">«external system»</text>
    <text x="110" y="45" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">SafeTrack System</text>
  </g>

  <!-- ResQperation System -->
  <g transform="translate(1010, 380)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="2" />
    <text x="110" y="24" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">«external system»</text>
    <text x="110" y="45" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">ResQperation Platform</text>
  </g>

  <!-- ================= EXTERNAL INTEGRATION FLOWS (Directed Labeled Arrows) ================= -->

  <!-- Flow 1: UC_VERIFY to SafeTrack -->
  <path d="M 790 585 L 1000 585" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)" />
  <rect x="815" y="562" width="160" height="20" rx="3" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="895" y="576" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">Demographics Query</text>

  <!-- Flow 2: UC_RESOURCES to ResQperation -->
  <path d="M 790 515 L 890 515 L 890 420 L 1000 420" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowRose)" />
  <rect x="860" y="440" width="130" height="20" rx="3" fill="#fff1f2" stroke="#fecdd3" />
  <text x="925" y="454" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">Logistics Demand</text>

  <!-- Flow 3: UC_ALERTS to ResQperation -->
  <path d="M 790 305 L 890 305 L 890 400 L 1000 400" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowRose)" />
  <rect x="805" y="320" width="175" height="20" rx="3" fill="#fff1f2" stroke="#fecdd3" />
  <text x="892" y="334" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">Push Notification Dispatch</text>

</svg>
